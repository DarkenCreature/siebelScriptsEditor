<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <div class="datasource">
      <div class="grid-item grid-1">
        <label for="connection">Name</label>
      </div>
      <div class="grid-item grid-2">
        <select
          name="connection"
          class="input select"
          id="connection"
          onchange="handleChange(event)"
        ></select>
      </div>
      <div class="grid-item grid-1">
        <label for="workspace">Workspace</label>
      </div>
      <div class="grid-item grid-2">
        <select
          name="workspace"
          class="input select"
          id="workspace"
          onchange="handleChange(event)"
        ></select>
      </div>
      <div class="grid-item grid-1">
        <label for="type">Object type</label>
      </div>
      <div class="grid-item grid-2">
        <select
          name="type"
          class="input select"
          id="type"
          onchange="handleChange(event)"
        ></select>
      </div>
      <div class="grid-item grid-12">
        <input
          type="search"
          name="search"
          class="input"
          id="search"
          oninput="handleChange(event)"
          placeholder="Type here to search"
        />
      </div>
    </div>
    <script>
      const vscode = acquireVsCodeApi(),
        state = vscode.getState() ?? {},
        objects = [
          "Business Service",
          "Business Component",
          "Applet",
          "Application",
          "Web Template",
          "Business Object",
        ],
        createOptions = (items = [], selected) =>
          items
            .map(
              (item) =>
                `<option class="option" value="${item}" ${item === selected ? "selected" : ""}>${item}</option>`,
            )
            .join(""),
        handleChange = ({ target: { id, value } }) => {
          state[id] = value;
          vscode.setState(state);
          vscode.postMessage({ command: id, data: value });
        },
        populate = () => {
          const {
              connections = [],
              connection = "",
              workspaces = [],
              workspace = "",
              type = "Business Service",
              search = "",
            } = state,
            noConnection = connections.length === 0,
            noWorkspaces = noConnection || workspaces.length === 0;
          document.getElementById("connection").innerHTML = createOptions(
            connections,
            connection,
          );
          document.getElementById("connection").disabled = noConnection;
          document.getElementById("workspace").innerHTML = createOptions(
            workspaces,
            workspace,
          );
          document.getElementById("workspace").disabled = noWorkspaces;
          document.getElementById("type").innerHTML = createOptions(
            objects,
            type,
          );
          document.getElementById("type").disabled = noWorkspaces;
          document.getElementById("search").value = search;
          document.getElementById("search").readOnly = noWorkspaces;
        };
      populate();
      window.addEventListener(
        "message",
        ({
          data: {
            connections = [],
            connection = "",
            workspaces = [],
            workspace = "",
            type = "Business Service",
          },
        }) => {
          state.connections = connections;
          state.connection = connection;
          state.workspaces = workspaces;
          state.workspace = workspace;
          state.type = type;
          state.search = "";
          vscode.setState(state);
          populate();
        },
      );
    </script>
  </body>
</html>
